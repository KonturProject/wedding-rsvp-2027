<div id="shared-auth">

    <div style="font-size:27px;margin-bottom:14px">💍</div>
    <h1>Наша свадьба</h1><p>Одна смета для Игната и Леры. Изменения сохраняются в закрытой Google-таблице и синхронизируются между телефонами.</p>
    <form id="shared-auth-form"><label for="shared-key-input">Ваш личный ключ доступа</label><input id="shared-key-input" type="password" minlength="4" autocomplete="off" placeholder="Вставьте ключ из Apps Script" required />

function offerTypeFor(expense){
  if(!expense)return {id:'orphan',title:'Без категории',icon:'📌'};
  const text=String(expense.title||'');
  const known=OFFER_TYPES.find(type=>type.test.test(text));
  return known||{id:'expense-'+String(expense.id).replace(/[^a-zA-Z0-9_-]/g,''),title:text||'Прочие услуги',icon:EMOJI[expense.category]||'📌'};
}
function getOfferTypes(){
  const types=new Map();
  for(const offer of state.offers){
    const expense=state.expenses.find(e=>e.id===offer.expenseId);
    const type=offerTypeFor(expense);
    if(!types.has(type.id))types.set(type.id,{...type,count:0});
    types.get(type.id).count++;
  }
  return Array.from(types.values()).sort((a,b)=>{
    const ai=OFFER_TYPES.findIndex(t=>t.id===a.id),bi=OFFER_TYPES.findIndex(t=>t.id===b.id);
    return (ai<0?999:ai)-(bi<0?999:bi)||a.title.localeCompare(b.title,'ru');
  });
}
function filteredOffers(){

    const expense=state.expenses.find(e=>e.id===o.expenseId),type=offerTypeFor(expense);
    if(offerView.type!=='all'&&type.id!==offerView.type)return false;
    if(offerView.category!=='all'&&expense?.category!==offerView.category)return false;
    if(offerView.status!=='all'&&o.status!==offerView.status)return false;
    if(q&&!([o.name,o.includes,o.extra,o.contact,o.note,expense?.title,expense?.city].join(' ').toLocaleLowerCase('ru').includes(q)))return false;
    return true;

  if(offerView.sort==='name')list.sort((a,b)=>String(a.name).localeCompare(String(b.name),'ru'));
  return list;
}

function moneyForImport(v,emptyAllowed=false){
  if(v==null||v==='')return emptyAllowed?0:null;
  const raw=String(v).replace(/[\s\u00a0\u202f]/g,'').replace(/₽|руб\.?/gi,'').replace(',','.');
  if(!/^\d+(\.\d{1,2})?$/.test(raw))return null;
  const n=Number(raw);
  return Number.isFinite(n)&&n>=0&&n<=10000000000?n:null;
}
function offerKey(o){return [o.expenseId,String(o.name||'').trim().toLocaleLowerCase('ru'),Number(o.total)].join('|')}
function parseOffersForImport(data){
  const list=Array.isArray(data)?data:(data&&Array.isArray(data.offers)?data.offers:data?.state?.offers);
  if(!Array.isArray(list))throw Error('Ожидается массив предложений или JSON с полем offers.');
  if(list.length>300)throw Error('Максимум 300 предложений в одном файле.');
  const existingKeys=new Set(state.offers.map(offerKey)),existingIds=new Set(state.offers.map(o=>String(o.id)));
  const accepted=[],errors=[];let duplicates=0;
  for(let i=0;i<list.length;i++){
    const raw=list[i];
    if(!raw||typeof raw!=='object'||Array.isArray(raw)){errors.push('Строка '+(i+1)+': неверная структура');continue;}
    const name=String(raw.name??raw.vendor??'').trim().slice(0,200);
    const title=String(raw.expenseTitle??raw.expense??raw.article??'').trim().toLocaleLowerCase('ru');
    const expense=state.expenses.find(e=>e.id===raw.expenseId) ||
      state.expenses.find(e=>title && e.title.trim().toLocaleLowerCase('ru')===title);
    const total=moneyForImport(raw.total??raw.price),deposit=moneyForImport(raw.deposit,true);
    if(!name||!expense||total===null||deposit===null){
      errors.push('Строка '+(i+1)+': '+(!name?'нет названия':!expense?'нет статьи расходов «'+title+'»':'неверная стоимость или аванс'));continue;
    }
    if(raw.id && existingIds.has(String(raw.id))){duplicates++;continue;}
    const norm={expenseId:expense.id,name,total,deposit,status:OFFER_STATUSES.includes(raw.status)?raw.status:'Рассматриваем',
      includes:String(raw.includes||'').slice(0,2500),extra:String(raw.extra||'').slice(0,2500),
      contact:String(raw.contact||'').slice(0,500),note:String(raw.note||'').slice(0,2500)};
    const key=offerKey(norm);
    if(existingKeys.has(key)){duplicates++;continue;}
    existingKeys.add(key);accepted.push(norm);
  }
  return {accepted,errors,duplicates,total:list.length,revision:sharedRev};
}
function importOffersFromFile(file){
  if(!sharedKey||sharedBusy||sharedDirty||sharedBlocked||sharedChecking){alert('Дождитесь завершения синхронизации и повторите импорт.');return;}
  if(file.size>1024*1024){alert('Файл больше 1 МБ. Разделите предложения на несколько файлов.');return;}
  file.text().then(text=>{
    const plan=parseOffersForImport(JSON.parse(text));
    const preview=plan.accepted.slice(0,12).map(o=>o.name+' · '+rub(o.total)+' · '+state.expenses.find(e=>e.id===o.expenseId)?.title).join('\n');
    const summary='Новых предложений: '+plan.accepted.length+'\nДубликатов: '+plan.duplicates+'\nПропущено с ошибками: '+plan.errors.length+
      (plan.errors.length?'\n\nОшибки:\n'+plan.errors.slice(0,8).join('\n'):'')+
      (preview?'\n\nБудут добавлены:\n'+preview:'')+
      '\n\nРасходы, бюджет, оплаты и проверки не изменятся.';
    if(!plan.accepted.length){alert(summary);return;}
    if(!confirm(summary+'\n\nДобавить предложения?'))return;
    if(sharedBusy||sharedDirty||sharedBlocked||sharedChecking){alert('За время предпросмотра смета изменилась. Повторите импорт.');return;}
    google.script.run.withSuccessHandler(remote=>{
      if(remote.version!==sharedRev||plan.revision!==sharedRev){
        sharedStatus('⚠ Общая смета обновилась на другом телефоне. Обновите её перед импортом.',true);
        alert('Другая версия сметы уже сохранена. Импорт отменён без изменений. Обновите смету и загрузите файл повторно.');return;
      }
      const present=new Set(state.offers.map(offerKey));
      const newItems=plan.accepted.filter(o=>!present.has(offerKey(o)));
      newItems.forEach((o,i)=>state.offers.push({id:'ofimport'+Date.now().toString(36)+'_'+i+'_'+Math.random().toString(36).slice(2,8),...o}));
      if(!newItems.length){toast('Такие предложения уже есть');return;}
      persist();closeSheet();tab='offers';render();toast('Добавлено '+newItems.length+'. Синхронизируем…');
    }).withFailureHandler(err=>alert('Импорт отменён: '+String(err?.message||'ошибка проверки сервера'))).loadBudget(sharedKey);
  }).catch(e=>alert('Импорт не выполнен: '+e.message));
}

function exportJson(){download('Свадьба_Игнат_Лера_копия.json',JSON.stringify({app:'wedding-mobile',version:1,savedAt:new Date().toISOString(),state},null,2),'application/json;charset=utf-8');toast('Резервная копия подготовлена')}
function csvCell(x){return '"'+String(x??'').replace(/"/g,'""')+'"'}
function exportCsv(){const cols=['Категория','Статья','Город','Включено','Количество','Единица','Выбор цены','Цена за единицу','План','Оплачено','Факт итог','К оплате','Комментарий'];const rows=[['Свадьба Игнат и Лера'],['Лимит',state.budget,'Гостей',state.guests,'Резерв %',state.reserve],[],cols];for(const e of state.expenses){const plan=subtotal(e,'Мой план');rows.push([e.category,e.title,e.city,e.enabled?'Да':'Нет',e.qty,e.unit,e.choice,selectedPrice(e,'Мой план'),plan,e.paid,e.actual==null?'':e.actual,e.enabled?Math.max(0,(e.actual==null?plan:n(e.actual))-n(e.paid)):0,e.note])}const c=calc('Мой план');rows.push([],['Итого до резерва',c.base],['Резерв',c.reserve],['ИТОГО',c.total],['Оплачено',c.paid],['К оплате без резерва',c.debt]);download('Свадебная_смета_мобильная.csv','\ufeff'+rows.map(r=>r.map(csvCell).join(';')).join('\r\n'),'text/csv;charset=utf-8');toast('CSV для Excel подготовлен')}
function applyOffer(id){const o=state.offers.find(x=>x.id===id);const e=state.expenses.find(x=>x.id===o?.expenseId);if(!o||!e)return;const amount=n(o.total);if(!confirm(`Применить предложение «${o.name}» за ${rub(amount)} к статье «${e.title}»?`))return;if(!n(e.qty)){e.qty=1;e.followGuests=false}e.custom=amount/n(e.qty);e.choice='Своя';e.enabled=true;o.status='Выбрано';persist();render();toast('Цена перенесена в «Мой план»')}
function readForm(form){return Object.fromEntries(new FormData(form).entries())}
function handleSubmit(event){const form=event.target;if(form.id==='offer-filters-form'){event.preventDefault();const d=readForm(form);offerView={type:d.type||'all',category:d.category||'all',status:d.status||'all',query:d.query||'',sort:d.sort||'default'};closeSheet();render();return;}if(!form.id||!['expense-form','new-expense-form','offer-form','check-form','params-form'].includes(form.id))return;event.preventDefault();const d=readForm(form);if(form.id==='expense-form'){const e=state.expenses.find(x=>x.id===form.dataset.id);if(!e)return;e.enabled=!!form.elements.enabled.checked;e.choice=d.choice;e.custom=maybeNum(d.custom);e.qty=n(d.qty);e.unit=d.unit||'услуга';e.category=d.category||'Другое';e.city=d.city||'';e.followGuests=!!form.elements.followGuests.checked;if(e.followGuests)e.qty=n(state.guests);e.paid=n(d.paid);e.actual=maybeNum(d.actual);e.note=d.note||''}else if(form.id==='new-expense-form'){const title=(d.title||'').trim();if(!title)return;state.expenses.push({id:'ex'+Date.now(),category:d.category||'Другое',title,city:d.city||'',unit:d.unit||'услуга',qty:n(d.qty),prices:{'Эконом':0,'В бюджет':0,'База':0,'Комфорт':0},choice:'Своя',custom:n(d.custom),enabled:true,paid:0,actual:null,note:'',followGuests:false})}else if(form.id==='offer-form'){let o=state.offers.find(x=>x.id===form.dataset.id);if(!o){o={id:'of'+Date.now()};state.offers.push(o)}Object.assign(o,{expenseId:d.expenseId,name:(d.name||'').trim(),total:n(d.total),deposit:n(d.deposit),status:d.status,includes:d.includes||'',extra:d.extra||'',contact:d.contact||'',note:d.note||''})}else if(form.id==='check-form'){const c=state.checklist.find(x=>x.id===form.dataset.id);if(!c)return;c.status=d.status;c.answer=d.answer||'';c.note=d.note||''}else if(form.id==='params-form'){state.budget=n(d.budget);state.guests=n(d.guests);state.reserve=n(d.reserve);for(const e of state.expenses)if(e.followGuests)e.qty=n(state.guests)}persist();closeSheet();render();toast('Сохранено')}
function handleClick(event){const trigger=event.target.closest('[data-action]');if(!trigger)return;const action=trigger.dataset.action;const id=trigger.dataset.id;if(action==='overlay'){if(event.target===trigger)closeSheet();return}if(action==='close'){closeSheet();return}if(action==='nav'){tab=trigger.dataset.tab;search='';filter='all';render();window.scrollTo({top:0,behavior:'instant'});return}if(action==='scenario'){state.scenario=trigger.dataset.value;persist();render();return}if(action==='filter'){filter=trigger.dataset.value;render();return}if(action==='offer-filters'){openOfferFilters();return}if(action==='clear-offer-filters'){offerView={type:'all',category:'all',status:'all',query:'',sort:'default'};closeSheet();render();return}if(action==='scroll-offers'){const rail=document.getElementById(trigger.dataset.rail);if(rail)rail.scrollBy({left:(trigger.dataset.direction==='-1'?-1:1)*Math.max(220,Math.round(rail.clientWidth*.75)),behavior:'smooth'});return}if(action==='settings'){settings();return}if(action==='params'){params();return}if(action==='edit-expense'){editExpense(id);return}if(action==='add-expense'){addExpense();return}if(action==='edit-offer'){editOffer(id);return}if(action==='add-offer'){editOffer(null);return}if(action==='edit-check'){editCheck(id);return}if(action==='toggle-check'){const c=state.checklist.find(x=>x.id===id);if(c){c.status=c.status==='Проверено'?'Не проверено':'Проверено';persist();render()}return}if(action==='apply-offer'){applyOffer(id);return}if(action==='delete-expense'){const e=state.expenses.find(x=>x.id===id);if(!e||!confirm(`Удалить статью «${e.title}»?`))return;state.expenses=state.expenses.filter(x=>x.id!==id);persist();closeSheet();render();toast('Статья удалена');return}if(action==='delete-offer'){if(!confirm('Удалить предложение?'))return;state.offers=state.offers.filter(x=>x.id!==id);persist();closeSheet();render();return}if(action==='import-offers'){document.getElementById('offers-import-input').click();return}if(action==='export-offers-template'){exportOffersTemplate();return}if(action==='export-json'){exportJson();return}if(action==='export-csv'){exportCsv();return}if(action==='import-json'){const input=document.getElementById('json-input');if(input)input.click();return}}
document.addEventListener('submit',handleSubmit);
document.addEventListener('click',handleClick);
document.addEventListener('input',e=>{if(e.target?.id==='search-input'){search=e.target.value;document.getElementById('expense-list').innerHTML=groups()}if(e.target.closest('#expense-form')){const form=e.target.closest('#expense-form');if(e.target.name==='custom'){form.elements.choice.value='Своя'}const el=form.querySelector('#expense-preview');const ex=state.expenses.find(x=>x.id===form.dataset.id);if(!el||!ex)return;const d=readForm(form);const v=d.choice==='Своя'?n(d.custom):n(ex.prices[d.choice]);const q=form.elements.followGuests.checked?n(state.guests):n(d.qty);el.textContent='По выбранной цене: '+rub(v*q)}});
document.addEventListener('change',async e=>{if(e.target?.id==='json-input'){const file=e.target.files?.[0];if(!file)return;try{const content=JSON.parse(await file.text());const s=content.state||content;if(!Array.isArray(s.expenses)||!Array.isArray(s.checklist)||!Array.isArray(s.offers))throw new Error('Неправильный формат');if(!confirm('Восстановить копию? Текущие данные на этом устройстве будут заменены.'))return;state={...structuredClone(INITIAL),...s};persist();closeSheet();render();toast('Копия восстановлена')}catch(error){alert('Не удалось прочитать копию: '+error.message)}}});
document.addEventListener('change',e=>{if(e.target?.id!=='offers-import-input')return;const file=e.target.files?.[0];e.target.value='';if(file)importOffersFromFile(file)});
document.addEventListener('keydown',e=>{if(e.key==='Escape')closeSheet()});
startShared();

// Apps Script HTML Service client. Keys are never added to URLs, source code or spreadsheet cells.
let sharedKey='',sharedAs='',sharedRev=0,sharedBusy=false,sharedDirty=false,sharedQueued=false,sharedBlocked=false;
let sharedSaveTimer=null,sharedChecking=false,sharedLastEdit=0;
function sharedStatus(message,warning=false){
  const el=document.getElementById('shared-sync');
  el.style.display='flex';el.classList.toggle('warn',warning);
  document.getElementById('shared-sync-status').textContent=message;
  document.getElementById('shared-backup').hidden=!warning;
}
function showLoginError(message){document.getElementById('login-error').textContent=message;}
function startShared(){
  if(!(window.google && google.script && google.script.run)){
    showLoginError('Эту версию нужно открыть по ссылке Google Apps Script после развёртывания. Адрес GitHub Pages работает как локальный вариант.');
    document.getElementById('shared-auth-submit').disabled=true;
    return;
  }
  document.getElementById('shared-auth-form').addEventListener('submit',e=>{
    e.preventDefault();const key=document.getElementById('shared-key-input').value.trim();
    if(key.length<4)return showLoginError('Ключ должен содержать минимум 4 символа.');
    connectShared(key);
  });
  document.getElementById('shared-refresh').addEventListener('click',()=>refreshShared(true));
  document.getElementById('shared-backup').addEventListener('click',exportJson);
  const previous=sessionStorage.getItem('wedding_shared_access_key');
  if(previous){document.getElementById('shared-key-input').value=previous;connectShared(previous)}
  setInterval(()=>{if(sharedKey&&!sharedBusy&&!sharedDirty&&!sharedBlocked&&!sharedChecking&&!document.querySelector('.overlay'))refreshShared(false)},30000);
}
function connectShared(key){
  const btn=document.getElementById('shared-auth-submit');btn.disabled=true;btn.textContent='Загружаем смету…';showLoginError('');
  google.script.run.withSuccessHandler(r=>{
    if(!r || !r.state || !Array.isArray(r.state.expenses)){
      showLoginError('Сервер вернул некорректную смету');btn.disabled=false;btn.textContent='Открыть общую смету';return;
    }
    sharedKey=key;sharedAs=r.accessAs||'';sharedRev=r.version;sharedDirty=false;sharedQueued=false;sharedBlocked=false;
    try{sessionStorage.setItem('wedding_shared_access_key',key)}catch(e){}
    state={...structuredClone(INITIAL),...r.state};
    try{localStorage.setItem(STORAGE,JSON.stringify(state))}catch(e){}
    document.getElementById('shared-auth').hidden=true;
    document.getElementById('app').style.display='block';
    render();sharedStatus('✓ Общая смета · '+sharedAs+' · синхронизировано');
    document.getElementById('shared-key-input').value='';
  }).withFailureHandler(err=>{
    showLoginError(err?.message||'Не удалось подключиться. Проверьте ключ и соединение.');
    btn.disabled=false;btn.textContent='Открыть общую смету';
    try{sessionStorage.removeItem('wedding_shared_access_key')}catch(e){}
  }).loadBudget(key);
}
function scheduleSharedSave(){
  if(!sharedKey)return;
  sharedDirty=true;sharedLastEdit=Date.now();
  if(sharedBlocked){sharedStatus('⚠ Есть несохранённые изменения. Сначала разрешите конфликт.',true);return;}
  sharedStatus('● Сохраняем изменения…');
  if(sharedSaveTimer)clearTimeout(sharedSaveTimer);
  sharedSaveTimer=setTimeout(pushShared,550);
}
function pushShared(){
  if(!sharedKey||sharedBlocked||!sharedDirty)return;
  if(sharedBusy){sharedQueued=true;return;}
  sharedBusy=true;sharedDirty=false;sharedQueued=false;
  const outgoing=structuredClone(state), version=sharedRev;
  google.script.run.withSuccessHandler(r=>{
    sharedBusy=false;sharedRev=r.version;
    if(sharedDirty||sharedQueued){sharedDirty=true;sharedQueued=false;scheduleSharedSave();return;}
    sharedStatus('✓ Общая смета · '+sharedAs+' · сохранено');
  }).withFailureHandler(err=>{
    sharedBusy=false;sharedDirty=true;sharedBlocked=true;
    const conflict=String(err?.message||'').includes('VERSION_CONFLICT');
    sharedStatus(conflict?'⚠ Кто-то изменил смету. Скачайте копию своих правок, затем обновите.':'⚠ Нет связи с сервером или ошибка записи. Скачайте копию и повторите.',true);
  }).saveBudget(sharedKey,version,outgoing);
}
function refreshShared(manual){
  if(!sharedKey||sharedChecking)return;
  if(sharedBusy||sharedDirty||sharedBlocked){
    if(!manual)return;
    if(!confirm('Есть локальные изменения, которые не были сохранены в общей базе. Сначала скачайте резервную копию через кнопку рядом. Заменить их свежей версией из облака?'))return;
  }
  sharedChecking=true;
  google.script.run.withSuccessHandler(r=>{
    sharedChecking=false;
    if(r.version!==sharedRev||sharedBlocked){
      // An active edit sheet is intentionally never replaced during background polling.
      if(document.querySelector('.overlay')&&!manual){sharedStatus('● Есть новые данные, завершите редактирование и нажмите «Обновить».',true);return;}
      state={...structuredClone(INITIAL),...r.state};sharedRev=r.version;sharedBlocked=false;sharedDirty=false;sharedQueued=false;
      try{localStorage.setItem(STORAGE,JSON.stringify(state))}catch(e){}
      if(manual&&document.querySelector('.overlay'))closeSheet();
      render();sharedStatus('✓ Получены изменения · '+(r.editor||'участник'));
    }else sharedStatus('✓ Общая смета · актуальная версия');
  }).withFailureHandler(err=>{
    sharedChecking=false;sharedStatus('⚠ Не удалось обновить: '+String(err?.message||'ошибка сети').slice(0,110),true);
  }).loadBudget(sharedKey);
}

window.__weddingTest={calc,selectedPrice,subtotal,getState:()=>state};
